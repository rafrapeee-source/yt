# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: push this repo to GitHub/GitLab, then in Render choose
# New + > Blueprint and select the repo.
services:
  - type: web
    name: findtube
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --omit=dev
    # Cap the JS heap below the free plan's 512 MB so garbage collection
    # kicks in before the platform kills the process for using too much memory.
    startCommand: node --max-old-space-size=320 server/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Optional overrides (defaults in server/config.js):
      # - key: YOUTUBE_API_HOST
      #   value: www.youtube.com
      # - key: RATE_LIMIT_API
      #   value: "180"
