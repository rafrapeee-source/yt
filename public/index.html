<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark light" />
<title>Findtube</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 20'%3E%3Crect width='28' height='20' rx='6' fill='%23ff0033'/%3E%3Cpath d='M11 6l7 4-7 4z' fill='white'/%3E%3C/svg%3E" />
<!-- Blocking on purpose: applies the saved light/dark theme before first paint. -->
<script src="/theme.js"></script>
<link rel="stylesheet" href="/styles.css" />
<!-- No bundler: preload the whole module graph in parallel instead of
     discovering it one import level (one network round trip) at a time. -->
<link rel="modulepreload" href="/js/util.js" />
<link rel="modulepreload" href="/js/icons.js" />
<link rel="modulepreload" href="/js/store.js" />
<link rel="modulepreload" href="/js/api.js" />
<link rel="modulepreload" href="/js/components.js" />
<link rel="modulepreload" href="/js/views/home.js" />
<link rel="modulepreload" href="/js/views/results.js" />
<link rel="modulepreload" href="/js/views/watch.js" />
<link rel="modulepreload" href="/js/views/channel.js" />
<link rel="modulepreload" href="/js/views/library.js" />
<link rel="modulepreload" href="/js/views/notfound.js" />
<script type="module" src="/js/main.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-start">
      <button type="button" class="icon-btn" id="guide-btn" aria-label="Menu" data-icon="menu"></button>
      <a href="/" class="logo" aria-label="Findtube home">
        <svg viewBox="0 0 28 20" aria-hidden="true"><rect width="28" height="20" rx="6" fill="#ff0033"/><path d="M11 6l7 4-7 4z" fill="#fff"/></svg>
        <span>Findtube</span>
      </a>
    </div>

    <form class="search" id="search-form" role="search" autocomplete="off">
      <div class="search-box">
        <input type="search" id="search-input" name="search_query" placeholder="Search" aria-label="Search"
               aria-autocomplete="list" aria-controls="suggestions" spellcheck="false" />
        <ul class="suggestions" id="suggestions" role="listbox" hidden></ul>
      </div>
      <button type="submit" class="search-btn" aria-label="Search" data-icon="search"></button>
    </form>

    <div class="masthead-end">
      <button type="button" class="icon-btn mobile-search-btn" id="mobile-search-btn" aria-label="Search" data-icon="search"></button>
      <button type="button" class="icon-btn" id="theme-btn" aria-label="Switch theme"></button>
      <button type="button" class="icon-btn" id="settings-btn" aria-label="Settings" data-icon="settings"></button>
    </div>
  </header>

  <div class="scrim" id="scrim" hidden></div>
  <nav class="guide" id="guide" aria-label="Main">
    <div class="guide-section">
      <a href="/" class="guide-item" data-route="home"><span data-icon="home"></span><span>Home</span></a>
      <a href="/feed/subscriptions" class="guide-item" data-route="subscriptions"><span data-icon="subscriptions"></span><span>Subscriptions</span></a>
      <a href="/feed/history" class="guide-item" data-route="history"><span data-icon="history"></span><span>History</span></a>
    </div>
    <div class="guide-section">
      <h3 class="guide-heading">Subscriptions</h3>
      <div id="guide-subs"></div>
    </div>
    <p class="guide-footer">
      Data comes straight from YouTube; videos play in YouTube's privacy-enhanced
      (nocookie) player. Subscriptions and history stay in this browser.
    </p>
  </nav>

  <main id="app" tabindex="-1"></main>

  <dialog id="settings-dialog" class="dialog" aria-labelledby="settings-title">
    <form method="dialog" class="dialog-body" id="settings-form">
      <header class="dialog-header">
        <h2 id="settings-title">Settings</h2>
        <button type="submit" class="icon-btn" aria-label="Close" data-icon="close" value="close"></button>
      </header>

      <label class="field">
        <span class="field-label">Theme</span>
        <select id="set-theme">
          <option value="system">Use device setting</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>

      <label class="check">
        <input type="checkbox" id="set-autoplay" />
        <span>Autoplay videos</span>
      </label>
      <label class="check">
        <input type="checkbox" id="set-autoplay-next" />
        <span>Play the next related video when one ends</span>
      </label>
      <p class="field-help">Subscriptions, history and settings are stored only in this browser.</p>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
